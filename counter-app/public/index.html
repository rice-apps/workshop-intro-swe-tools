<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Counter App</title>
  <link id="theme-stylesheet" rel="stylesheet" href="modern.css" />
</head>
<body>
  <main class="card">
    <h1>Counter</h1>
    <p class="count" id="count">0</p>
    <div class="buttons">
      <button id="decrement">-1</button>
      <button id="increment">+1</button>
    </div>
  </main>

  <script src="app.js"></script>
</body>
</html>
